
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siddharth Pal | ApnoAI Task 2</title>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel: allows JSX inside this HTML file -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .glass {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .profile-bg {
      background: linear-gradient(
        135deg,
        #a855f7 0%,
        #ec4899 50%,
        #fb923c 100%
      );
    }

    .dark-bg {
      background: linear-gradient(135deg, #020617, #1e1b4b, #312e81);
    }

    .avatar {
      width: 124px;
      height: 124px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      color: #111827;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 24px 18px;
      }

      .avatar {
        width: 105px;
        height: 105px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // COMPONENT:
    // ProfileCard is a reusable UI block.
    // Props are the data passed into this component.

    function ProfileCard({
      name,
      role,
      bio,
      skills,
      avatar,
      github,
      linkedin
    }) {
      // STATE: values that can change when a user interacts.
      const [isDark, setIsDark] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [likes, setLikes] = useState(0);

      return (
        <main
          className={`${
            isDark ? "dark-bg" : "profile-bg"
          } min-h-screen w-full flex items-center justify-center p-4 sm:p-6 transition-all duration-500`}
        >
          {/* Dark mode button */}
          <button
            onClick={() => setIsDark(!isDark)}
            aria-label="Toggle dark mode"
            title={isDark ? "Switch to light mode" : "Switch to dark mode"}
            className="fixed top-5 right-5 z-10 rounded-full glass p-3 text-xl hover:scale-110 transition"
          >
            {isDark ? "☀️" : "🌙"}
          </button>

          {/* Profile card */}
          <section
            className={`profile-card ${
              isDark ? "glass-dark" : "glass"
            } w-full max-w-md rounded-3xl p-8 shadow-2xl text-center`}
          >
            {/* Profile photo */}
            <div className="flex justify-center mb-6">
              <img
                src={avatar}
                alt={`${name}'s profile`}
                className="avatar"
              />
            </div>

            {/* Name and role: values come from props */}
            <h1
              className={`text-3xl font-bold mb-2 ${
                isDark ? "text-white" : "text-gray-900"
              }`}
            >
              {name}
            </h1>

            <p
              className={`text-lg font-medium ${
                isDark ? "text-purple-200" : "text-gray-800"
              }`}
            >
              {role}
            </p>

            {/* Bio */}
            <p
              className={`mt-5 mb-6 leading-7 ${
                isDark ? "text-gray-200" : "text-gray-800"
              }`}
            >
              {bio}
            </p>

            {/* Skills are displayed using map() */}
            <div className="flex flex-wrap justify-center gap-2 mb-7">
              {skills.map((skill, index) => (
                <span
                  key={index}
                  className={`rounded-full px-4 py-2 text-sm font-semibold ${
                    isDark
                      ? "bg-white/10 text-white border border-white/20"
                      : "bg-white/60 text-gray-900 border border-white/50"
                  }`}
                >
                  {skill}
                </span>
              ))}
            </div>

            {/* Interactive Connect button */}
            <button
              onClick={() => setIsConnected(!isConnected)}
              className={`w-full rounded-xl py-3 font-bold mb-4 transition ${
                isConnected
                  ? "bg-green-500 text-white"
                  : isDark
                  ? "bg-white text-gray-900 hover:bg-gray-200"
                  : "bg-gray-900 text-white hover:bg-gray-800"
              }`}
            >
              {isConnected ? "✓ Connected" : "Connect"}
            </button>

            {/* Bonus feature: Like counter */}
            <button
              onClick={() => setLikes(likes + 1)}
              className={`w-full rounded-xl py-3 font-semibold mb-6 transition ${
                isDark
                  ? "bg-pink-500/20 text-pink-200 hover:bg-pink-500/30"
                  : "bg-white/50 text-gray-900 hover:bg-white/70"
              }`}
            >
              ❤️ Like · {likes}
            </button>

            {/* Social links */}
            <div className="flex justify-center gap-4 mb-6">
              {github && (
                <a
                  href={github}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="social-link"
                  aria-label="GitHub profile"
                  title="GitHub"
                >
                  GH
                </a>
              )}

              {linkedin && (
                <a
                  href={linkedin}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="social-link"
                  aria-label="LinkedIn profile"
                  title="LinkedIn"
                >
                  in
                </a>
              )}
            </div>

            {/* Footer */}
            <div className="border-t border-white/30 pt-5">
              <p
                className={`text-xs ${
                  isDark ? "text-gray-300" : "text-gray-700"
                }`}
              >
                Built with React 18 · ApnoAI Internship Task 2
              </p>
              <p
                className={`text-xs mt-2 ${
                  isDark ? "text-gray-400" : "text-gray-600"
                }`}
              >
                Siddharth Pal | Web Development Intern
              </p>
            </div>
          </section>
        </main>
      );
    }

    // PROPS:
    // Customize these values to update the profile card.

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ProfileCard
        name="Siddharth Pal"
        role="Web Development Intern at ApnoAI"
        bio="I am a BTech CSE student passionate about web development and modern UI design. I enjoy building responsive websites and learning React."
        skills={["HTML", "CSS", "JavaScript"]}
        avatar="./siddharth.jpg"  
        github="https://github.com/siddharthpal589-oss"
        linkedin=""
      />
    );
  </script>
</body>
</html>
